name: CutNova - Free Browser Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/browser_smoke.py"
      - ".github/workflows/browser-smoke.yml"
      - "index.html"
      - "device-qa.js"
      - "editor.js"
      - "nav.js"
      - "sw.js"
  push:
    branches: [main]
    paths:
      - "tests/browser_smoke.py"
      - ".github/workflows/browser-smoke.yml"
      - "index.html"
      - "device-qa.js"
      - "editor.js"
      - "nav.js"
      - "sw.js"

permissions:
  contents: read

jobs:
  chromium-smoke:
    name: Mobile-width and desktop Chromium UI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright browser runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Install FFmpeg only when missing
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Generate original local MP4 fixture (video and sine-wave audio)
        run: |
          mkdir -p smoke-artifacts
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=320x180:rate=15 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 6 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 64k -movflags +faststart \
            smoke-artifacts/original-fixture.mp4
          test -s smoke-artifacts/original-fixture.mp4
      - name: Serve current PR site locally (no cloud credentials or user media)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/cutnova-http.log 2>&1 &
          echo $! >/tmp/cutnova-http.pid
          sleep 2
          curl -f --silent http://127.0.0.1:8765/ >/dev/null
      - name: Click through V5.0 readiness report with synthetic source
        run: python tests/browser_smoke.py
      - name: Upload only synthetic-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutnova-v50-browser-smoke
          path: smoke-artifacts/*-evidence.png
          retention-days: 3
          if-no-files-found: ignore
