name: CutNova - Read-only Link Preflight

on:
  push:
    paths:
      - "smoke/user-video-preflight.txt"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout GitHub-only project
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install media metadata library
        run: python -m pip install 'yt-dlp>=2025.1.0,<2028'
      - name: Probe user-provided video URL without downloading
        run: python link_preflight.py
      - name: Save diagnostic metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutnova-video-link-preflight
          path: preflight/preflight_report.json
          retention-days: 4
          if-no-files-found: error
