name: CutNova - Code Checks

on:
  push:
    paths:
      - "studio.py"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test engine compilation
        run: python -m py_compile studio.py
      - name: Test video highlight rules
        run: python -m unittest discover -s tests -v
      - name: Test app JS syntax and dashboard request integration
        run: |
          node --check app.js
          node tests/test_dashboard.cjs
