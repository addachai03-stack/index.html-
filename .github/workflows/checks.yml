name: CutNova - Code Checks

on:
  push:
    paths:
      - "studio.py"
      - "github_media.py"
      - "requirements.txt"
      - "roman_captions.py"
      - "caption_styles.py"
      - "animated_captions.py"
      - "speech_quality.py"
      - "smartcrop.py"
      - "tracking_crop.py"
      - "pacing.py"
      - "hook_rank.py"
      - "premium.py"
      - "parse_request.py"
      - ".github/ISSUE_TEMPLATE/**"
      - "app.js"
      - "jobs.js"
      - "editor.js"
      - "pwa.js"
      - "nav.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "index.html"
      - "styles.css"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test engine compilation
        run: python -m py_compile studio.py
      - name: Install FFmpeg for render proof
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Test video highlight rules
        run: python -m unittest discover -s tests -v
      - name: Test app JS syntax and dashboard request integration
        run: |
          node --check app.js
          node tests/test_dashboard.cjs
          node --check jobs.js
          node tests/test_jobs.cjs
          node --check editor.js
          node tests/test_editor.cjs
          node --check pwa.js
          node --check nav.js
          node --check sw.js
          node tests/test_pwa.cjs
          node tests/test_navigation.cjs
