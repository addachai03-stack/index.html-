name: CutNova - Code Checks

on:
  push:
    paths:
      - "studio.py"
      - "social_convert.py"
      - "direct_media.py"
      - "github_media.py"
      - "github_media.py"
      - "requirements.txt"
      - "roman_captions.py"
      - "caption_styles.py"
      - "animated_captions.py"
      - "speech_quality.py"
      - "smartcrop.py"
      - "tracking_crop.py"
      - "pacing.py"
      - "hook_rank.py"
      - "premium.py"
      - "parse_request.py"
      - ".github/ISSUE_TEMPLATE/**"
      - "app.js"
      - "owner-render.js"
      - "jobs.js"
      - "editor.js"
      - "export-check.js"
      - "full-export-test.js"
      - "playback-check.js"
      - "saved-file-check.js"
      - "native-share.js"
      - "social-codec-check.js"
      - "local-reencode.js"
      - "pwa.js"
      - "refresh.js"
      - "refresh.html"
      - "nav.js"
      - "launch.js"
      - "sw.js"
      - "manifest.webmanifest"
      - "icons/**"
      - "index.html"
      - "styles.css"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test engine compilation
        run: python -m py_compile studio.py social_convert.py direct_media.py github_media.py
      - name: Install FFmpeg for render proof
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Test video highlight rules
        run: python -m unittest discover -s tests -v
      - name: Test app JS syntax and dashboard request integration
        run: |
          node --check app.js
          node tests/test_dashboard.cjs
          node --check owner-render.js
          node tests/test_owner_render.cjs
          node --check jobs.js
          node tests/test_jobs.cjs
          node tests/test_results_ui.cjs
          node --check editor.js
          node tests/test_editor.cjs
          node --check export-check.js
          node tests/test_export_check.cjs
          node --check full-export-test.js
          node tests/test_full_export.cjs
          node --check playback-check.js
          node tests/test_playback_check.cjs
          node --check saved-file-check.js
          node tests/test_saved_file_check.cjs
          node --check native-share.js
          node tests/test_native_share.cjs
          node --check social-codec-check.js
          node tests/test_social_codec_check.cjs
          node --check local-reencode.js
          node tests/test_local_reencode.cjs
          node --check pwa.js
          node --check refresh.js
          node --check nav.js
          node --check launch.js
          node --check sw.js
          node tests/test_pwa.cjs
          node tests/test_refresh.cjs
          node tests/test_navigation.cjs
          node tests/test_beta_launch.cjs
