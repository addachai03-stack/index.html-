name: CutNova Gateway Security Checks

on:
  push:
    paths:
      - "backend/cutnova-render-worker.js"
      - "tests/cutnova_worker_test.cjs"
      - ".github/workflows/cutnova-gateway-tests.yml"
  pull_request:
    paths:
      - "backend/cutnova-render-worker.js"
      - "tests/cutnova_worker_test.cjs"
      - ".github/workflows/cutnova-gateway-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify owner-only gateway and GitHub dispatch responses
        run: node --test tests/cutnova_worker_test.cjs
