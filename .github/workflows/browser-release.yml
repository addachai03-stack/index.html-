name: CutNova - Browser Release Proof
on:
  push:
    paths:
      - "tests/browser_release.py"
      - ".github/workflows/browser-release.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser and media tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps "$ENGINE"
          command -v ffmpeg || sudo apt-get install -y ffmpeg
      - name: Real browser editor and offline smoke
        run: python tests/browser_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-proof-${{ matrix.engine }}
          path: release-proof/
          retention-days: 7
          if-no-files-found: warn
