name: CutNova - Android Beta APK
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable test APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and signing
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CutNova-Android-v2.6.1-Beta.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/CutNova-Android-v2.6.1-Beta.apk
          test -s dist/CutNova-Android-v2.6.1-Beta.apk
          sha256sum dist/CutNova-Android-v2.6.1-Beta.apk > dist/CutNova-Android-v2.6.1-Beta.apk.sha256
      - name: Android emulator cold-launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r dist/CutNova-Android-v2.6.1-Beta.apk
            adb shell am start -W -n com.cutnova.android/.MainActivity
            sleep 12
            adb shell pidof com.cutnova.android
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|com.cutnova.android'
            adb shell screencap -p /sdcard/cutnova.png
            adb pull /sdcard/cutnova.png dist/cutnova-emulator.png
      - name: Store installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CutNova-Android-Beta
          path: dist/
          retention-days: 30
      - name: Publish public beta download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cutnova-android-v2.6.1-beta
          target_commitish: ${{ github.sha }}
          name: CutNova Android Beta v2.6.1
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/CutNova-Android-v2.6.1-Beta.apk
            dist/CutNova-Android-v2.6.1-Beta.apk.sha256
          body: |
            CutNova Android v2.6.1 beta launcher fix. Mobile tabs: Home, AI, Editor, Projects, Results.

            Opens inside persistent native WebView; press CHROME in the app toolbar to export/download video when WebView media APIs or blob downloads are unavailable. Android 7.0+, internet on first use. Reinstall may be needed due to different debug signing keys. The original device remains untested.

            This is a debug-signed **beta test APK**, not a production Play Store release. Future builds may require uninstalling the old app due to different debug signing keys. Keep original media; drafts stored by the browser may be cleared.
