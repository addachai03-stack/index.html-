name: CutNova - Generate Shorts
run-name: CutNova owner ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public HTTPS long-video URL; only videos you own or may edit"
        type: string
        required: true
      request_id:
        description: "Optional non-secret client tracking UUID; no video URL or credentials"
        type: string
        required: false
        default: "manual"
      clips:
        description: "Number of Shorts (integer 1-10)"
        type: string
        default: "3"
        required: true
      min_seconds:
        description: "Minimum seconds (15-60; set min=max for exact duration)"
        type: string
        default: "30"
        required: true
      max_seconds:
        description: "Maximum seconds (15-60; 30/30 gives exact 30s)"
        type: string
        default: "30"
        required: true
      style:
        description: "Highlight style (heuristic, not actual trends)"
        type: choice
        options:
          - "engagement"
          - "funny"
          - "facts"
          - "story"
        default: "engagement"
        required: true
      language:
        description: "Spoken language hint for subtitles"
        type: choice
        options:
          - "auto"
          - "hi"
          - "en"
        default: "auto"
        required: true
      caption_script:
        description: "Caption script: original or approximate Roman Hindi (Hinglish)"
        type: choice
        options:
          - "original"
          - "roman"
        default: "original"
        required: true
      caption_style:
        description: "Burned-in caption appearance"
        type: choice
        options:
          - "classic"
          - "yellow"
          - "boxed"
          - "karaoke"
        default: "classic"
        required: true
      crop:
        description: "9:16 crop: static Auto, sampled moving Track, or Center"
        type: choice
        options:
          - "auto"
          - "center"
          - "track"
        default: "auto"
        required: true
      pacing:
        description: "Original timing or conservative quiet-pause removal"
        type: choice
        options: ["original", "tight"]
        default: "original"
        required: true
      rights_confirm:
        description: "I own or have permission to edit and republish this video"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: cutnova-shorts-${{ github.actor }}
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.actor == github.repository_owner && inputs.rights_confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VIDEO_URL: ${{ inputs.video_url }}
      CLIPS: ${{ inputs.clips }}
      MIN_SEC: ${{ inputs.min_seconds }}
      MAX_SEC: ${{ inputs.max_seconds }}
      STYLE: ${{ inputs.style }}
      CROP: ${{ inputs.crop }}
      LANGUAGE: ${{ inputs.language }}
      CAPTION_SCRIPT: ${{ inputs.caption_script }}
      CAPTION_STYLE: ${{ inputs.caption_style }}
      PACING: ${{ inputs.pacing }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg + font support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Verify FFmpeg codecs
        run: |
          ffmpeg -version | head -n 1
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -filters | grep subtitles
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate real portrait Shorts
        run: |
          python studio.py \
            --url "$VIDEO_URL" \
            --clips "$CLIPS" \
            --min-seconds "$MIN_SEC" \
            --max-seconds "$MAX_SEC" \
            --style "$STYLE" \
            --crop "$CROP" \
            --language "$LANGUAGE" \
            --caption-script "$CAPTION_SCRIPT" \
            --caption-style "$CAPTION_STYLE" \
            --pacing "$PACING" \
            --rights-confirmed
      - name: Show actual render outcome and recovery on GitHub run summary
        if: always()
        run: python render_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload MP4 Shorts + transcripts + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutnova-shorts-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.srt
            output/*.ass
            output/*.zip
            output/*.json
            output/*.md
            output/*.csv
            output/*.txt
          retention-days: 7
          if-no-files-found: warn
