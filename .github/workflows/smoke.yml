name: CutNova - One-Time Real MP4 Test

on:
  push:
    paths:
      - "smoke/run-once.txt"

permissions:
  contents: read

jobs:
  smoke-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine dependencies
        run: python -m pip install -r requirements.txt
      - name: Test a licensed, CORS-enabled public 30-second video
        run: |
          python studio.py \
            --url "https://remotion.media/video-30s.mp4" \
            --clips 1 --min-seconds 15 --max-seconds 15 \
            --rights-confirmed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutnova-smoke-test
          path: |
            output/*.zip
            output/*.mp4
            output/*.srt
            output/*.json
          retention-days: 1
          if-no-files-found: warn
