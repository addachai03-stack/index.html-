name: CutNova - Generate Shorts from URL Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cutnova-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    # Only the repo owner can spend Actions minutes on a submitted issue.
    if: ${{ github.actor == github.repository_owner && startsWith(github.event.issue.title, '[CutNova] Generate Shorts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Parse the user-confirmed video request safely
        id: request
        env:
          CUTNOVA_ISSUE_BODY: ${{ github.event.issue.body }}
        run: python parse_request.py
      - name: Install FFmpeg + font support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Verify required FFmpeg codecs
        run: |
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -filters | grep subtitles
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate actual 9:16 MP4 Shorts
        env:
          VIDEO_URL: ${{ steps.request.outputs.video_url }}
          CLIPS: ${{ steps.request.outputs.clips }}
          MIN_SEC: ${{ steps.request.outputs.min_sec }}
          MAX_SEC: ${{ steps.request.outputs.max_sec }}
          STYLE: ${{ steps.request.outputs.style }}
        run: |
          python studio.py \
            --url "$VIDEO_URL" \
            --clips "$CLIPS" \
            --min-seconds "$MIN_SEC" \
            --max-seconds "$MAX_SEC" \
            --style "$STYLE" \
            --rights-confirmed
      - name: Upload MP4, captions and diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutnova-issue-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.srt
            output/*.zip
            output/*.json
            output/*.md
            output/*.csv
          retention-days: 7
          if-no-files-found: warn
      - name: Post result link to requested issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const page = 'https://github.com/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            const success = '${{ job.status }}' === 'success';
            const body = success
              ? '✅ **CutNova Shorts processing complete.** Open [this GitHub Actions run](' + page +
                ') and download the **cutnova-issue** ZIP under Artifacts. Review MP4 and ASR captions before publishing.'
              : '⚠️ **CutNova could not finish the Shorts request.** Check [the run logs and output report](' +
                page + '). Public platforms can block downloads and no login/DRM bypass is used.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
