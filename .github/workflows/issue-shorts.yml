name: CutNova - Generate Shorts from URL Request

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: cutnova-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    # Only the repo owner can spend Actions minutes on a submitted issue.
    if: ${{ github.actor == github.repository_owner && startsWith(github.event.issue.title, '[CutNova] Generate Shorts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Parse the user-confirmed video request safely
        id: request
        env:
          CUTNOVA_ISSUE_BODY: ${{ github.event.issue.body }}
        run: python parse_request.py
      - name: Install FFmpeg + font support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Verify required FFmpeg codecs
        run: |
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -filters | grep subtitles
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate actual 9:16 MP4 Shorts
        env:
          VIDEO_URL: ${{ steps.request.outputs.video_url }}
          CLIPS: ${{ steps.request.outputs.clips }}
          MIN_SEC: ${{ steps.request.outputs.min_sec }}
          MAX_SEC: ${{ steps.request.outputs.max_sec }}
          STYLE: ${{ steps.request.outputs.style }}
          CROP: ${{ steps.request.outputs.crop }}
          LANGUAGE: ${{ steps.request.outputs.language }}
          CAPTION_SCRIPT: ${{ steps.request.outputs.caption_script }}
          CAPTION_STYLE: ${{ steps.request.outputs.caption_style }}
          PACING: ${{ steps.request.outputs.pacing }}
        run: |
          python studio.py \
            --url "$VIDEO_URL" \
            --clips "$CLIPS" \
            --min-seconds "$MIN_SEC" \
            --max-seconds "$MAX_SEC" \
            --style "$STYLE" \
            --crop "$CROP" \
            --language "$LANGUAGE" \
            --caption-script "$CAPTION_SCRIPT" \
            --caption-style "$CAPTION_STYLE" \
            --pacing "$PACING" \
            --rights-confirmed
      - name: Upload MP4, captions and diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutnova-issue-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.srt
            output/*.ass
            output/*.zip
            output/*.json
            output/*.md
            output/*.csv
          retention-days: 7
          if-no-files-found: warn
      - name: Post result link to requested issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const page = 'https://github.com/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            const success = '${{ job.status }}' === 'success';
            const fs = require('fs');
            let reason = '';
            try {
              const report = JSON.parse(fs.readFileSync('output/report.json', 'utf8'));
              reason = String(report.error || '');
            } catch (error) { /* Parsing or preflight may have failed before report exists. */ }
            const blocked = /sign in to confirm|confirm you.re not a bot/i.test(reason);
            const githubMediaError = /github video attachment|github uploaded video|github returned a webpage/i.test(reason.toLowerCase());
            const uploadForm = 'https://github.com/' + context.repo.owner + '/' +
              context.repo.repo + '/issues/new?template=cutnova-shorts.yml';
            const failureGuide = blocked
              ? 'YouTube blocked GitHub access (bot verification). **No MP4 was generated.** Do not share cookies or passwords. If you own the video, export the original MP4 and [upload it from your iPhone using the GitHub form](' + uploadForm + '). The Issue/uploaded file will be PUBLIC (GitHub video limit 100 MB).'
              : githubMediaError
                ? 'Your attached video was not accessible to the runner. Verify the GitHub public attachment is complete, under 100 MB, and your issue includes exactly one source.'
                : 'Check the error report and logs. Social websites sometimes block downloads, and no login/DRM bypass is used. You may [upload a public-to-share MP4 directly on GitHub](' + uploadForm + ').';
            const body = success
              ? '✅ **CutNova Shorts processing complete.** Open [this GitHub Actions run](' + page +
                ') and download the **cutnova-issue** ZIP under Artifacts. Review MP4 and ASR captions before publishing.'
              : '⚠️ **CutNova request failed.** [Read this run and diagnostics](' + page +
                '). ' + failureGuide;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
