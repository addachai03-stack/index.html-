name: CutNova - Deploy Mobile Studio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cutnova-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages (requires one-time user setup)
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html autolive.html autolive.js moment_queue.js refresh.html refresh.js app.js local-highlights.js audio-peaks.js smart-mix.js owner-render.js jobs.js editor.js export-check.js full-export-test.js playback-check.js saved-file-check.js native-share.js social-codec-check.js local-reencode.js pwa.js nav.js launch.js sw.js styles.css manifest.webmanifest _site/
          cp -r autolive _site/
          cp -r icons _site/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
