name: CutNova - Deploy Mobile Studio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cutnova-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages (requires one-time user setup)
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html refresh.html refresh.js app.js jobs.js editor.js pwa.js nav.js launch.js sw.js styles.css manifest.webmanifest _site/
          cp -r icons _site/
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
