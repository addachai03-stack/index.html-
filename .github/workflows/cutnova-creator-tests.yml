name: CutNova AI Creator Pack Tests

on:
  push:
    paths:
      - "studio.py"
      - "premium.py"
      - "hook_rank.py"
      - "tests/test_premium.py"
      - ".github/workflows/cutnova-creator-tests.yml"
  pull_request:
    paths:
      - "studio.py"
      - "premium.py"
      - "hook_rank.py"
      - "tests/test_premium.py"
      - ".github/workflows/cutnova-creator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-copy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Test source-grounded creator packs, captions and exact clip seconds
        run: python -m unittest discover -s tests -p 'test_premium.py' -v
      - name: Test multilingual hook ranking and precise clip boundaries
        run: python -m unittest discover -s tests -p 'test_hook_rank.py' -v
